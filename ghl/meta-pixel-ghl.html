<!-- ============================================================
     Electricidad y Antenas DLR · Píxel de Meta para GoHighLevel
     ------------------------------------------------------------
     DÓNDE: GHL > Sites > funnel de placas solares > Settings >
            Tracking Code > HEAD, DESPUÉS del bloque de cookies.
     Píxel: 1841156110309467

     Si el visitante no acepta "Publicidad", NO se carga nada de Meta.
     Al aceptar, se carga el píxel y se envía PageView.
     Eventos: PageView · Contact (llamar / WhatsApp) ·
              Lead (automático en cualquier URL que contenga "gracias").
     ============================================================ -->
<script>
(function () {
  'use strict';

  var PIXEL_ID = '1841156110309467';
  var arrancado = false;

  function acepta() {
    try {
      if (window.dlrConsent && typeof window.dlrConsent.estado === 'function') {
        var e = window.dlrConsent.estado();
        if (e) return !!e.publicidad;
      }
      var b = localStorage.getItem('dlr_consent');
      return b ? !!JSON.parse(b).publicidad : false;
    } catch (e) { return false; }
  }

  function arrancar() {
    if (arrancado || !acepta()) return;
    arrancado = true;

    /* código base del píxel: solo se inyecta con consentimiento */
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', PIXEL_ID);
    fbq('track', 'PageView');

    /* Lead: la página de gracias, reconocida por su URL.
       Añade aquí cualquier otra ruta de gracias que tengas. */
    if (esGracias()) {
      fbq('track', 'Lead', { content_name: 'Placas solares', content_category: 'Landing GHL' });
    }

    if (typeof window.dlrMetaAlArrancar === 'function') {
      try { window.dlrMetaAlArrancar(); } catch (e) {}
    }
  }

  function esGracias() {
    var ruta = (location.pathname || '').toLowerCase();
    return ruta.indexOf('gracias') !== -1 || ruta.indexOf('thank') !== -1;
  }

  arrancar();
  var reloj = setInterval(function () {
    arrancar();
    if (arrancado) clearInterval(reloj);
  }, 400);
  setTimeout(function () { clearInterval(reloj); }, 180000);

  /* Contact: clic en llamar o en WhatsApp */
  document.addEventListener('click', function (ev) {
    if (!arrancado || typeof fbq !== 'function') return;
    var t = ev.target;
    var a = t && t.closest ? t.closest('a[href^="tel:"], a[href*="wa.me"], a[href*="api.whatsapp.com"]') : null;
    if (!a) return;
    fbq('track', 'Contact', {
      metodo: a.getAttribute('href').indexOf('tel:') === 0 ? 'telefono' : 'whatsapp'
    });
  }, true);

  window.dlrMeta = { activo: function () { return arrancado; } };
})();
</script>
