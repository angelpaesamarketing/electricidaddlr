<!-- ============================================================
     Electricidad y Antenas DLR
     Añade WhatsApp a los atajos de ESCRITORIO de la landing solar.
     En móvil no toca nada: ahí ya está la barra fija de abajo.

     DÓNDE: en la página de placas solares, al final del bloque de
            la landing, o en Page Settings > Tracking Code > FOOTER.
     ============================================================ -->
<style>
.dlr-solar .atajos .btn-wa{background:#25d366;color:#07321a;
  box-shadow:0 10px 26px -12px rgba(37,211,102,.8)}
.dlr-solar .atajos .btn-wa svg{width:17px;height:17px}
@media (max-width:900px){ .dlr-solar .atajos .btn-wa{display:none} }
</style>
<script>
(function () {
  'use strict';

  var URL_WA = 'https://wa.me/34652967349?text=' +
    encodeURIComponent('Hola, quiero información sobre placas solares');

  var ICONO = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
    '<path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.1l-.9 1.1c-.2.2-.3.2-.6.1' +
    'a8 8 0 0 1-4-3.5c-.2-.3 0-.5.1-.6l.8-.9c.2-.2.2-.4.1-.7l-1-2.3c-.2-.5-.5-.5-.7-.5' +
    'h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.8 5.9 5.2' +
    '.8.3 1.5.5 2 .7.8.3 1.6.2 2.2.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.2-.6-.3z"/>' +
    '<path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1' +
    'l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';

  function poner() {
    var atajos = document.getElementById('atajos') ||
                 document.querySelector('.dlr-solar .atajos');
    if (!atajos) return false;
    if (atajos.querySelector('.btn-wa')) return true;   /* ya estaba */

    var a = document.createElement('a');
    a.className = 'btn btn-wa';
    a.href = URL_WA;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', 'Escribir por WhatsApp al 652 967 349');
    a.innerHTML = ICONO + '<span class="atajo-txt">WhatsApp</span>';

    var presupuesto = atajos.querySelector('.btn-azul');
    if (presupuesto) atajos.insertBefore(a, presupuesto);
    else atajos.appendChild(a);
    return true;
  }

  if (poner()) return;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', poner);
  }
  var reloj = setInterval(function () { if (poner()) clearInterval(reloj); }, 300);
  setTimeout(function () { clearInterval(reloj); }, 15000);
})();
</script>
